apiVersion: v1
kind: Config
current-context: alpha
clusters:
  - name: alpha-cluster
    cluster:
      server: https://127.0.0.1:1
      insecure-skip-tls-verify: true
  - name: beta-cluster
    cluster:
      server: https://127.0.0.1:2
      insecure-skip-tls-verify: true
users:
  - name: alpha-user
    user:
      token: alpha-token
  - name: beta-user
    user:
      token: beta-token
contexts:
  - name: alpha
    context:
      cluster: alpha-cluster
      user: alpha-user
      namespace: team-a
  - name: beta
    context:
      cluster: beta-cluster
      user: beta-user
