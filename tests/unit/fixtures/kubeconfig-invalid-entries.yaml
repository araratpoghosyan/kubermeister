# What a hand edit or an interrupted `kubectl config set-context` leaves behind: entries kubectl
# still loads and lists, but which name no cluster, no user, or nothing at all.
apiVersion: v1
kind: Config
current-context: alpha
clusters:
  - name: alpha-cluster
    cluster:
      server: https://127.0.0.1:1
      insecure-skip-tls-verify: true
  - name: no-server
    cluster: {}
users:
  - name: alpha-user
    user:
      token: alpha-token
  - user:
      token: nameless
contexts:
  - name: alpha
    context:
      cluster: alpha-cluster
      user: alpha-user
      namespace: team-a
  - name: development
    context:
      cluster: ''
      user: ''
  - context:
      cluster: alpha-cluster
      user: alpha-user
