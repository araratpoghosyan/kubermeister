apiVersion: v1
kind: Namespace
metadata:
  name: km-e2e
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: km-e2e
data:
  greeting: hello-from-e2e
  LOG_LEVEL: debug
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: km-e2e
  labels:
    app: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: busybox:1.36
          command: ['sh', '-c', 'while true; do echo km-e2e-marker; sleep 5; done']
          ports:
            - containerPort: 8080
          resources:
            limits:
              cpu: 100m
              memory: 32Mi
---
apiVersion: batch/v1
kind: Job
metadata:
  name: import
  namespace: km-e2e
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: import
          image: busybox:1.36
          command: ['sh', '-c', 'echo imported']
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: nightly
  namespace: km-e2e
spec:
  schedule: '0 2 * * *'
  suspend: true
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: tick
              image: busybox:1.36
              command: ['sh', '-c', 'echo tick']
---
apiVersion: v1
kind: Secret
metadata:
  name: app-secret
  namespace: km-e2e
type: Opaque
data:
  # "super-secret-value"; the app must never read or render this value.
  password: c3VwZXItc2VjcmV0LXZhbHVl
