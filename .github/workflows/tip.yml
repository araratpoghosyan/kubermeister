name: Tip

# Rolling nightly: every push to main that passes CI rebuilds the `tip` pre-release. The tag is
# force-moved to the commit and the fixed-name assets are replaced, so there is always exactly one
# tip release pointing at the latest good commit. The build ships as a separate app, "Kubermeister
# Tip" (io.kubermeister.tip), so it installs and runs alongside a stable Kubermeister with its own
# settings. Versioned releases are release.yml.
on:
  push:
    branches: [main]

permissions:
  contents: read

# Never cancel a half-published tip; queue instead.
concurrency:
  group: tip
  cancel-in-progress: false

jobs:
  ci:
    name: ci
    uses: ./.github/workflows/ci.yml

  release:
    name: move tip release
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # Lightweight tag: an annotated one needs a committer identity the runner does not have.
      - name: Move the tip tag to this commit
        run: |
          git tag -f tip "$GITHUB_SHA"
          git push --force origin tip
      - name: Create or update the tip pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BUILD=$(git rev-list --count HEAD)
          NOTES=$(printf 'Nightly build **#%s** from `%s` on %s.\n\nRolling pre-release rebuilt on every merge to main. Not a versioned release and may break. Installs as a separate app, Kubermeister Tip, next to the stable one.' \
            "$BUILD" "${GITHUB_SHA::7}" "$(date -u +%Y-%m-%d)")
          if gh release view tip --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit tip --repo "$GITHUB_REPOSITORY" --prerelease --title "Kubermeister Tip (Nightly)" --notes "$NOTES"
          else
            gh release create tip --repo "$GITHUB_REPOSITORY" --prerelease --title "Kubermeister Tip (Nightly)" --notes "$NOTES"
          fi

  package:
    name: package (${{ matrix.os }})
    needs: release
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    env:
      # Deterministic unsigned builds until signing secrets exist.
      CSC_IDENTITY_AUTO_DISCOVERY: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # build number = commit count
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Package as Kubermeister Tip
        shell: bash
        env:
          # Only the presence flag: exporting CSC_LINK itself when the secret is empty makes
          # electron-builder treat "" as a certificate path and fail with "not a file".
          HAS_SIGNING_CERT: ${{ secrets.CSC_LINK != '' }}
        run: |
          # Separate identity so tip and stable coexist: name, app id, package name, icons, and a
          # version that electron-updater can order (<next stable>-tip.<build number>). The update
          # feed is the fixed tip download URL, so the tip app only ever follows tip builds.
          BUILD=$(git rev-list --count HEAD)
          VERSION="$(node -p "require('./package.json').version")-tip.${BUILD}"
          flags=(
            -c.artifactName='Kubermeister-tip-${os}-${arch}.${ext}'
            -c.productName='Kubermeister Tip'
            -c.appId=io.kubermeister.tip
            -c.extraMetadata.name=kubermeister-tip
            -c.extraMetadata.version="$VERSION"
            -c.mac.icon=resources/icon-tip.icns
            -c.win.icon=resources/icon-tip.ico
            -c.linux.icon=resources/icon-tip.png
            -c.publish.provider=generic
            -c.publish.url="https://github.com/${GITHUB_REPOSITORY}/releases/download/tip"
          )
          # Without a Developer ID certificate, ad-hoc sign the macOS bundle so its signature is
          # valid: Gatekeeper then shows the standard unverified-developer dialog (right-click,
          # Open) instead of "damaged". Hardened runtime only matters for notarization and blocks
          # ad-hoc library validation, so it is off in that case.
          if [ "$RUNNER_OS" = macOS ] && [ "$HAS_SIGNING_CERT" != true ]; then
            flags+=(-c.mac.identity=- -c.mac.hardenedRuntime=false)
          fi
          npm run package -- "${flags[@]}"
      - name: Upload assets to the tip release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          case "$RUNNER_OS" in
            # electron-builder names the updater metadata after the channel, "tip" here.
            macOS)   files=(release/*.dmg release/*.dmg.blockmap release/tip-mac.yml) ;;
            Windows) files=(release/*.exe release/*.exe.blockmap release/tip.yml) ;;
            Linux)   files=(release/*.AppImage release/*.deb release/tip-linux.yml) ;;
          esac
          gh release upload tip "${files[@]}" --repo "$GITHUB_REPOSITORY" --clobber
