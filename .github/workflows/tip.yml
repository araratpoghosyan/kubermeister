name: Tip

# Rolling nightly: every push to main that passes CI rebuilds the `tip` pre-release. The tag is
# force-moved to the commit and the build's assets, named by version, join the release; the
# previous build's are pruned once the feed names the new one, so there is always exactly one
# tip release pointing at the latest good commit. The build ships as a separate app, "Kubermeister
# Tip" (io.kubermeister.tip), so it installs and runs alongside a stable Kubermeister with its own
# settings. Versioned releases are release.yml.
on:
  push:
    branches: [main]

permissions:
  contents: read

# Never cancel a half-published tip; queue instead.
concurrency:
  group: tip
  cancel-in-progress: false

jobs:
  ci:
    name: ci
    uses: ./.github/workflows/ci.yml

  release:
    name: move tip release
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # Lightweight tag: an annotated one needs a committer identity the runner does not have.
      # GITHUB_TOKEN may not move a ref across a commit that changes a workflow file, and once a
      # merge under .github/workflows sits between the tag and main every later move crosses it
      # too. The move is therefore best effort so the build still publishes: TIP_TAG_TOKEN, a
      # token with workflow permission, makes it exact; without one the tag stays put and the
      # release notes and the feed still name the commit a build came from.
      - name: Move the tip tag to this commit
        env:
          TOKEN: ${{ secrets.TIP_TAG_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          git tag -f tip "$GITHUB_SHA"
          if git push --force "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" tip; then
            exit 0
          fi
          echo "::warning::could not move the tip tag to ${GITHUB_SHA::7}; set TIP_TAG_TOKEN to a token with workflow permission"
      - name: Create or update the tip pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BUILD=$(git rev-list --count HEAD)
          NOTES=$(printf 'Nightly build **#%s** from `%s` on %s.\n\nRolling pre-release rebuilt on every merge to main. Not a versioned release and may break. Installs as a separate app, Kubermeister Tip, next to the stable one.' \
            "$BUILD" "${GITHUB_SHA::7}" "$(date -u +%Y-%m-%d)")
          if gh release view tip --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit tip --repo "$GITHUB_REPOSITORY" --prerelease --title "Kubermeister Tip (Nightly)" --notes "$NOTES"
          else
            gh release create tip --repo "$GITHUB_REPOSITORY" --prerelease --title "Kubermeister Tip (Nightly)" --notes "$NOTES"
          fi

  package:
    name: package (${{ matrix.os }})
    needs: release
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # build number = commit count
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          check-latest: true
          cache: npm
      - run: npm ci
      - name: Compute the tip version
        id: version
        # <next stable>-tip.<build number>: orderable by electron-updater, unique per commit.
        # Explicit bash: the Windows default shell is PowerShell, where this line yields "".
        shell: bash
        run: |
          echo "version=$(node -p "require('./package.json').version")-tip.$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"
          echo "notes=Nightly build #$(git rev-list --count HEAD) from ${GITHUB_SHA::7} on $(date -u +%Y-%m-%d). Rebuilt on every change to main." >> "$GITHUB_OUTPUT"
      # Separate identity so tip and stable coexist: name, app id, package name, icons, version,
      # and an update feed fixed to the tip download URL so the tip app only follows tip builds.
      # The release notes ride in the feed file, which is what the in-app update popover shows.
      # Installers are named by version (the stable pattern, spelt out because the tip product
      # name has a space): a build never overwrites the files the live feed points at, and the
      # action prunes the previous build only after the feed has moved on.
      - uses: ./.github/actions/package
        with:
          release-tag: tip
          metadata-channel: tip
          prune: 'true'
          flags: |
            -c.artifactName=Kubermeister-${version}-${os}-${arch}.${ext}
            -c.productName=Kubermeister Tip
            -c.appId=io.kubermeister.tip
            -c.extraMetadata.name=kubermeister-tip
            -c.extraMetadata.version=${{ steps.version.outputs.version }}
            -c.releaseInfo.releaseNotes=${{ steps.version.outputs.notes }}
            -c.mac.icon=resources/icon-tip.icns
            -c.win.icon=resources/icon-tip.ico
            -c.linux.icon=resources/icon-tip.png
            -c.publish.provider=generic
            -c.publish.url=https://github.com/${{ github.repository }}/releases/download/tip
          github-token: ${{ secrets.GITHUB_TOKEN }}
          csc-link: ${{ secrets.CSC_LINK }}
          csc-key-password: ${{ secrets.CSC_KEY_PASSWORD }}
          apple-id: ${{ secrets.APPLE_ID }}
          apple-app-specific-password: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          apple-team-id: ${{ secrets.APPLE_TEAM_ID }}
