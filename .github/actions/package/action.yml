name: Package and upload
description: >
  Build, package with electron-builder, and upload installers plus electron-updater metadata to a
  GitHub release. Signs and notarizes macOS when the Apple secrets are passed in; otherwise ad-hoc
  signs so the bundle stays openable.

inputs:
  release-tag:
    description: Release tag to upload to (must already exist).
    required: true
  metadata-channel:
    description: electron-updater metadata file prefix ("latest" for stable, "tip" for nightly).
    required: true
  prune:
    description: >
      After the feed names this build, delete this OS's installer assets from earlier builds. Only
      for a rolling release that accumulates builds under one tag; a versioned release holds one.
    required: false
    default: 'false'
  flags:
    description: Extra electron-builder -c overrides, one per line.
    required: false
    default: ''
  github-token:
    required: true
  csc-link:
    description: Base64 .p12 with the Developer ID Application certificate. Empty = unsigned.
    required: false
    default: ''
  csc-key-password:
    required: false
    default: ''
  apple-id:
    required: false
    default: ''
  apple-app-specific-password:
    required: false
    default: ''
  apple-team-id:
    required: false
    default: ''

runs:
  using: composite
  steps:
    - run: npm run build
      shell: bash

    - name: Package
      shell: bash
      env:
        # Secrets arrive as inputs and are exported only when non-empty: electron-builder treats a
        # defined-but-empty CSC_LINK as a certificate path and fails with "not a file".
        IN_CSC_LINK: ${{ inputs.csc-link }}
        IN_CSC_KEY_PASSWORD: ${{ inputs.csc-key-password }}
        IN_APPLE_ID: ${{ inputs.apple-id }}
        IN_APPLE_APP_SPECIFIC_PASSWORD: ${{ inputs.apple-app-specific-password }}
        IN_APPLE_TEAM_ID: ${{ inputs.apple-team-id }}
        EXTRA_FLAGS: ${{ inputs.flags }}
      run: |
        flags=()
        # Strip a trailing carriage return: on Windows runners the multi-line input arrives CRLF.
        while IFS= read -r line; do line=${line%$'\r'}; [ -n "$line" ] && flags+=("$line"); done <<< "$EXTRA_FLAGS"
        if [ "$RUNNER_OS" = macOS ]; then
          if [ -n "$IN_CSC_LINK" ]; then
            # Developer ID signing; hardened runtime stays on (electron-builder.yml default).
            export CSC_LINK="$IN_CSC_LINK" CSC_KEY_PASSWORD="$IN_CSC_KEY_PASSWORD"
            if [ -n "$IN_APPLE_ID" ]; then
              # Notarize and staple so Gatekeeper opens the app with no dialog.
              export APPLE_ID="$IN_APPLE_ID" APPLE_APP_SPECIFIC_PASSWORD="$IN_APPLE_APP_SPECIFIC_PASSWORD" APPLE_TEAM_ID="$IN_APPLE_TEAM_ID"
              flags+=(-c.mac.notarize=true)
            fi
          else
            # No certificate (forks, local): ad-hoc sign so the bundle signature is valid and
            # Gatekeeper shows the unverified-developer dialog instead of "damaged". Hardened
            # runtime only matters for notarization and blocks ad-hoc library validation.
            export CSC_IDENTITY_AUTO_DISCOVERY=false
            flags+=(-c.mac.identity=- -c.mac.hardenedRuntime=false)
          fi
        fi
        npm run package -- "${flags[@]}"

    # The installer names carry the version, so a new build never overwrites the assets a
    # published feed still points at; the previous build stays whole until the feed has moved.
    - name: Name this OS's installers
      id: files
      shell: bash
      env:
        CHANNEL: ${{ inputs.metadata-channel }}
      run: |
        shopt -s nullglob
        case "$RUNNER_OS" in
          macOS)   files=(release/*.dmg release/*.dmg.blockmap release/*.zip release/*.zip.blockmap); feed="release/${CHANNEL}-mac.yml"; marker='-mac-' ;;
          Windows) files=(release/*.exe release/*.exe.blockmap); feed="release/${CHANNEL}.yml"; marker='-win-' ;;
          Linux)   files=(release/*.AppImage release/*.deb); feed="release/${CHANNEL}-linux.yml"; marker='-linux-' ;;
        esac
        [ "${#files[@]}" -gt 0 ] || { echo "::error::no installers under release/"; exit 1; }
        test -f "$feed" || { echo "::error::missing updater metadata $feed"; exit 1; }
        for f in "${files[@]}"; do case "$f" in *"$marker"*) ;; *) echo "::error::$f does not carry the $marker marker the prune step relies on"; exit 1 ;; esac; done
        printf 'installers<<EOL\n%s\nEOL\n' "$(printf '%s\n' "${files[@]}")" >> "$GITHUB_OUTPUT"
        echo "feed=$feed" >> "$GITHUB_OUTPUT"
        echo "marker=$marker" >> "$GITHUB_OUTPUT"

    # One file per call, retried with backoff: GitHub's upload service fails a large asset now
    # and then with a 5xx, and one such failure must not cost the whole build. `--clobber` only
    # ever meets an asset of this same build, left by a failed attempt or an earlier run of it.
    - name: Upload installers
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        TAG: ${{ inputs.release-tag }}
        INSTALLERS: ${{ steps.files.outputs.installers }}
      run: |
        retry() {
          local attempt=1 delay=15
          until "$@"; do
            if [ "$attempt" -ge 5 ]; then echo "::error::gave up after $attempt attempts: $*"; return 1; fi
            echo "::warning::attempt $attempt failed: $*; retrying in ${delay}s"
            sleep "$delay"; attempt=$((attempt + 1)); delay=$((delay * 2))
          done
        }
        while IFS= read -r f; do
          [ -n "$f" ] || continue
          retry gh release upload "$TAG" "$f" --repo "$GITHUB_REPOSITORY" --clobber < /dev/null
        done <<< "$INSTALLERS"

    # Read every asset back and compare size and checksum before the feed may name it: an upload
    # that returned success but stored something else must fail here, not on a user's machine.
    - name: Verify the uploaded installers
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        TAG: ${{ inputs.release-tag }}
        INSTALLERS: ${{ steps.files.outputs.installers }}
      run: |
        sha256() { if command -v sha256sum >/dev/null; then sha256sum "$1"; else shasum -a 256 "$1"; fi | cut -d' ' -f1; }
        assets=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[] | "\(.name)\t\(.state)\t\(.size)\t\(.digest)"')
        ok=true
        while IFS= read -r f; do
          [ -n "$f" ] || continue
          name=$(basename "$f")
          expected=$(printf '%s\t%s\t%s\t%s' "$name" uploaded "$(wc -c < "$f" | tr -d ' ')" "sha256:$(sha256 "$f")")
          if grep -qxF "$expected" <<< "$assets"; then
            echo "ok  $name"
          else
            echo "::error::$name on the release does not match the packaged file"
            echo "  expected: $expected"
            echo "  release:  $(grep -F "$name" <<< "$assets" || echo '<missing>')"
            ok=false
          fi
        done <<< "$INSTALLERS"
        $ok

    # Metadata last: the feed is what a running app reads, so it names only assets that exist
    # and have been checked. Overwriting the previous feed is the one in-place write here.
    - name: Upload updater metadata
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        TAG: ${{ inputs.release-tag }}
        FEED: ${{ steps.files.outputs.feed }}
      run: |
        retry() {
          local attempt=1 delay=15
          until "$@"; do
            if [ "$attempt" -ge 5 ]; then echo "::error::gave up after $attempt attempts: $*"; return 1; fi
            echo "::warning::attempt $attempt failed: $*; retrying in ${delay}s"
            sleep "$delay"; attempt=$((attempt + 1)); delay=$((delay * 2))
          done
        }
        retry gh release upload "$TAG" "$FEED" --repo "$GITHUB_REPOSITORY" --clobber

    # Only this OS's assets, only once its feed points elsewhere, and best effort: a leftover
    # asset costs nothing, a deleted one the feed still names costs an update.
    - name: Prune this OS's earlier builds
      if: inputs.prune == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        TAG: ${{ inputs.release-tag }}
        INSTALLERS: ${{ steps.files.outputs.installers }}
        MARKER: ${{ steps.files.outputs.marker }}
      run: |
        keep=$(while IFS= read -r f; do [ -n "$f" ] && basename "$f"; done <<< "$INSTALLERS")
        gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' \
          | while IFS= read -r name; do
              case "$name" in *.yml) continue ;; *"$MARKER"*) ;; *) continue ;; esac
              grep -qxF "$name" <<< "$keep" && continue
              if gh release delete-asset "$TAG" "$name" --repo "$GITHUB_REPOSITORY" --yes < /dev/null; then
                echo "pruned $name"
              else
                echo "::warning::could not prune $name; it stays on the release"
              fi
            done
