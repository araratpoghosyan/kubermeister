<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!-- Nightly ("tip") variant of icon.svg: same mark on a darker slate tile with an amber TIP
       badge, so the two apps are distinguishable side by side in the Dock and in Applications. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b4256" />
      <stop offset="1" stop-color="#252a3a" />
    </linearGradient>
    <linearGradient id="badge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffb545" />
      <stop offset="1" stop-color="#f28c1a" />
    </linearGradient>
    <filter id="badge-elev" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#05070f" flood-opacity="0.45" />
    </filter>
  </defs>

  <rect x="104" y="104" width="816" height="816" rx="182" ry="182" fill="url(#tile)" />

  <g transform="translate(226.4 226.4) scale(8.925)" fill="none" stroke="#ffffff" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="32" cy="32" r="20" stroke-width="4.5" />
    <path d="M26.82 12.68 25.01 5.92M46.14 17.86 51.09 12.91M51.32 37.18 58.08 38.99M37.18 51.32 38.99 58.08M17.86 46.14 12.91 51.09M12.68 26.82 5.92 25.01" stroke-width="4.5" />
    <path d="M37.66 26.34 46.14 17.86M39.73 34.07 51.32 37.18M34.07 39.73 37.18 51.32M26.34 37.66 17.86 46.14M24.27 29.93 12.68 26.82" stroke-width="3" opacity="0.6" />
    <path d="M30.96 28.14 26.82 12.68" stroke-width="4.5" />
    <circle cx="25.01" cy="5.92" r="4.2" fill="#ffffff" stroke="none" />
    <circle cx="32" cy="32" r="4.5" fill="#ffffff" stroke="none" />
  </g>

  <!-- TIP badge, bottom-right, inside the tile's safe area -->
  <g filter="url(#badge-elev)">
    <rect x="556" y="700" width="300" height="150" rx="44" ry="44" fill="url(#badge)" />
    <text x="706" y="806" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="800" font-size="104" letter-spacing="8" fill="#1a1400">TIP</text>
  </g>
</svg>
