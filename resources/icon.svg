<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3d5bd6" />
      <stop offset="1" stop-color="#2a45b0" />
    </linearGradient>
    <!-- Subtle top-light on the mark: white falling to an icy blue-white -->
    <linearGradient id="mark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" />
      <stop offset="1" stop-color="#d9e2ff" />
    </linearGradient>
    <!-- Elevation: a soft ambient shadow + a tight contact shadow (units are the mark's 24-unit space) -->
    <filter id="elev" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0.55" stdDeviation="0.65" flood-color="#0e1c66" flood-opacity="0.45" />
      <feDropShadow dx="0" dy="0.12" stdDeviation="0.18" flood-color="#0a154d" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- macOS-style rounded tile with ~10% transparent margin; radius ≈ 22.37% of the tile side -->
  <rect x="104" y="104" width="816" height="816" rx="182" ry="182" fill="url(#tile)" />

  <!-- Kubermeister hexagon mark (mirrors src/renderer/components/km-logo.tsx), white on the tile.
       Source viewBox is 0 0 24 24; scaled ×23.625 and centered on the tile (512,512).
       Hexagon vertices are rounded with quadratic corners (r ≈ 1.43 units). -->
  <g transform="translate(228.5,228.5) scale(23.625)" fill="none" stroke="url(#mark)" stroke-linejoin="round" stroke-linecap="round" filter="url(#elev)">
    <path d="M13.23 2.71 L19.43 6.29 Q20.66 7 20.66 8.43 L20.66 15.57 Q20.66 17 19.43 17.71 L13.23 21.29 Q12 22 10.77 21.29 L4.57 17.71 Q3.34 17 3.34 15.57 L3.34 8.43 Q3.34 7 4.57 6.29 L10.77 2.71 Q12 2 13.23 2.71 Z" stroke-width="1.4" />
    <path d="M12 7V17M7.67 9.5 16.33 14.5M16.33 9.5 7.67 14.5" stroke-width="1" opacity="0.55" />
    <circle cx="12" cy="12" r="2" fill="url(#mark)" stroke="none" />
  </g>
</svg>
